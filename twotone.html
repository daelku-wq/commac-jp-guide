<!doctype html>
<html lang="ja" data-theme="light" style="--accent: #E0457B; --accent-deep: #B8325F; --accent-soft: #FDEEF3;"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COMMA,C 콘텐츠 가이드 — 파우더 투톤 차렵이불</title><style>
:root{
  --accent:#2FA39B;
  --accent-deep:#1F8179;
  --accent-soft:#E6F5F3;
  --mark:#FAF08C;
  --cream:#FCF6DC;
  --cream-ink:#8A6B14;

  --t1-bg:#EAF6F2; --t1-ink:#12857A;
  --t2-bg:#FEF6E2; --t2-ink:#A87516;
  --t3-bg:#F1EFFB; --t3-ink:#5B4CC0;
  --t4-bg:#EBF2FC; --t4-ink:#2A68BE;

  --page-1:#F2FAF7;
  --page-2:#FDFBEF;
  --card:#FFFFFF;
  --block:#F6F8F8;
  --line:#E6EBEA;
  --ink:#141818;
  --ink-2:#4E5656;
  --muted:#8B9393;
  --ng:#D33A5E;
  --dark:#1A1F1F;
  --shadow:0 1px 2px rgba(20,24,24,.04), 0 22px 44px -28px rgba(20,24,24,.22);

  --f-disp:"Archivo",system-ui,sans-serif;
  --f-ko:"Noto Sans KR","Archivo",system-ui,sans-serif;
  --f-ja:"Zen Kaku Gothic New","Noto Sans JP","Archivo",system-ui,sans-serif;
  --maxw:1020px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#45BAB2; --accent-deep:#63D6CE; --accent-soft:#143230;
    --mark:#6A6220; --cream:#2E2913; --cream-ink:#E0C974;
    --t1-bg:#152F2B; --t1-ink:#6FD5C6;
    --t2-bg:#332A15; --t2-ink:#E2B662;
    --t3-bg:#231F3E; --t3-ink:#A79AEE;
    --t4-bg:#152437; --t4-ink:#7FB0EE;
    --page-1:#0E1212; --page-2:#121514;
    --card:#191D1D; --block:#202525; --line:#2B3131;
    --ink:#EAEFEF; --ink-2:#B2BBBB; --muted:#7C8585;
    --ng:#FF8AA6; --dark:#0A0C0C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 22px 44px -28px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --accent:#45BAB2; --accent-deep:#63D6CE; --accent-soft:#143230;
  --mark:#6A6220; --cream:#2E2913; --cream-ink:#E0C974;
  --t1-bg:#152F2B; --t1-ink:#6FD5C6;
  --t2-bg:#332A15; --t2-ink:#E2B662;
  --t3-bg:#231F3E; --t3-ink:#A79AEE;
  --t4-bg:#152437; --t4-ink:#7FB0EE;
  --page-1:#0E1212; --page-2:#121514;
  --card:#191D1D; --block:#202525; --line:#2B3131;
  --ink:#EAEFEF; --ink-2:#B2BBBB; --muted:#7C8585;
  --ng:#FF8AA6; --dark:#0A0C0C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 22px 44px -28px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;color:var(--ink);font-family:var(--f-ko);font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  background:var(--page-1);
  background-image:linear-gradient(176deg,var(--page-1) 0%,var(--page-2) 72%,var(--page-1) 100%);
  background-attachment:fixed;
}
html[lang="ja"] body{font-family:var(--f-ja)}
html[lang="ja"] .hd,html[lang="ja"] .tile h4,html[lang="ja"] .pen,html[lang="ja"] .sc-t{font-weight:900;letter-spacing:0}
h1,h2,h3,h4{margin:0;line-height:1.4;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:inherit}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
img{max-width:100%;display:block}
mark{background:linear-gradient(transparent 52%, var(--mark) 52%, var(--mark) 92%, transparent 92%);color:inherit;padding:0 2px}
em{font-style:normal;font-weight:700;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
:root[data-theme="dark"] .topbar{background:rgba(25,29,29,.85)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .topbar{background:rgba(25,29,29,.85)}}
.topbar-in{max-width:var(--maxw);margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tb-brand{max-width:300px;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-disp);font-weight:800;font-size:14.5px;letter-spacing:.03em;white-space:nowrap}
.tb-brand i{font-style:normal;color:var(--accent)}
.tb-nav{display:flex;gap:2px;flex:1;justify-content:center;flex-wrap:wrap;min-width:0}
.tb-nav a{text-decoration:none;font-size:13.5px;font-weight:500;color:var(--ink-2);padding:6px 13px;border-radius:999px;white-space:nowrap}
.tb-nav a:hover{color:var(--accent-deep);background:var(--accent-soft)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:.04em;background:var(--card)}
.lang button{padding:5px 13px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.conf{font-family:var(--f-disp);font-size:10px;font-weight:700;letter-spacing:.13em;color:var(--muted);white-space:nowrap}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px 80px;display:flex;flex-direction:column;gap:22px}
.wrap > section{scroll-margin-top:88px}
.wrap > section:first-child{margin-top:26px}

/* ---------- the widget card ---------- */
.pc{background:var(--card);border-radius:26px;padding:44px 40px;box-shadow:var(--shadow)}
.pc.tight{padding:26px 32px}

/* centered section head with highlighter */
.sect{text-align:center;margin-bottom:30px}
.sect .eb{display:inline-flex;align-items:center;gap:11px;font-family:var(--f-disp);font-size:11.5px;font-weight:700;letter-spacing:.17em;color:var(--accent);text-transform:uppercase}
.sect .eb::before{content:"";width:22px;height:1.5px;background:var(--accent)}
.sect .hd{font-size:28px;font-weight:700;letter-spacing:-.025em;margin-top:13px}
.sect .sb{font-size:14px;color:var(--muted);margin-top:11px}

/* nested sub-card */
.sc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 24px;display:flex;flex-direction:column}
.sc-h{text-align:center;margin-bottom:18px}
.sc-h .l{font-family:var(--f-disp);font-size:10.5px;font-weight:700;letter-spacing:.15em;color:var(--accent);text-transform:uppercase}
.sc-h .sc-t{font-size:17px;font-weight:700;margin-top:6px;letter-spacing:-.015em}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:700;font-size:13.5px;padding:12px 22px;transition:background .15s ease,border-color .15s ease,color .15s ease;text-decoration:none}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover{background:var(--accent-deep)}
.btn-g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn-g:hover{border-color:var(--accent);color:var(--accent-deep)}
.btn-full{width:100%}
.btn-c{align-self:center}

/* ---------- 1. product ---------- */
.prow{display:grid;grid-template-columns:1.22fr .78fr;gap:16px;align-items:start}
.shot{border-radius:18px;overflow:hidden;background:var(--block);border:1px solid var(--line)}
.shot img{width:100%;height:auto}
.pinfo{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.pill{align-self:flex-start;background:var(--accent-soft);color:var(--accent-deep);font-size:12px;font-weight:700;border-radius:999px;padding:5px 14px}
.pinfo h3{font-size:21px;letter-spacing:-.02em}
.pen{font-size:16.5px;font-weight:700;line-height:1.65;letter-spacing:-.01em}
.pinfo .desc{font-size:13.5px;color:var(--ink-2);line-height:1.85}

/* 라인 소개 */
.intro{margin-top:22px;display:flex;flex-direction:column;gap:6px;text-align:center}
.intro p{font-size:clamp(17px,2.05vw,21px);font-weight:900;color:var(--ink);line-height:1.6;letter-spacing:-.025em}

/* 제품 여러 개 — 카드 그리드 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:22px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pcard .shot{border:none;border-radius:0;border-bottom:1px solid var(--line)}
.pcard .pcbody{padding:18px 18px 20px;display:flex;flex-direction:column;gap:9px;flex:1}
.pcard h4{font-size:16px;letter-spacing:-.015em}
.pcard .pcpen{font-size:13px;color:var(--ink-2);line-height:1.7}
.pcard .pcbtns{margin-top:auto;padding-top:6px;display:flex;flex-direction:column;gap:7px}
.pcard .btn{padding:10px 14px;font-size:12.5px}
.allcopy{margin-top:20px;display:flex;flex-direction:column;align-items:center}
.linkw{display:flex;flex-direction:column;gap:11px;align-items:stretch}
.urlbox{display:block;font-family:var(--f-disp);font-size:11.5px;color:var(--accent-deep);background:var(--block);border:1px solid var(--line);border-radius:10px;padding:11px 13px;word-break:break-all;line-height:1.55;text-align:center;text-decoration:none}
.urlbox:hover{border-color:var(--accent);background:var(--accent-soft)}
.prow.solo{grid-template-columns:1.05fr 1fr;align-items:center}
.prow.solo .pinfo{margin-top:0}

/* 제공 상품과 콘텐츠 포인트 사이 추가 상품 이미지 */
.campaign-gallery{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.campaign-gallery .campaign-img{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.campaign-gallery .campaign-img img{width:100%;height:auto;display:block}

/* ---------- 2. point tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{border-radius:18px;padding:24px 22px;display:flex;flex-direction:column;gap:10px}
.tile:nth-child(1){background:var(--t1-bg)} .tile:nth-child(1) h4{color:var(--t1-ink)} .tile:nth-child(1) .kw{color:var(--t1-ink)}
.tile:nth-child(2){background:var(--t2-bg)} .tile:nth-child(2) h4{color:var(--t2-ink)} .tile:nth-child(2) .kw{color:var(--t2-ink)}
.tile:nth-child(3){background:var(--t3-bg)} .tile:nth-child(3) h4{color:var(--t3-ink)} .tile:nth-child(3) .kw{color:var(--t3-ink)}
.tile:nth-child(4){background:var(--t4-bg)} .tile:nth-child(4) h4{color:var(--t4-ink)} .tile:nth-child(4) .kw{color:var(--t4-ink)}
.tile .kw{font-family:var(--f-disp);font-size:11px;font-weight:800;letter-spacing:.12em;opacity:.7;text-align:center}
.tile h4{font-size:16.5px;letter-spacing:-.015em;line-height:1.5;text-align:center}
.tile p{font-size:12.5px;color:var(--ink-2);line-height:1.75}
.fn{color:var(--muted);font-size:11.5px;margin-top:16px;text-align:center;line-height:1.7}

/* ---------- 3. concepts ---------- */
.concepts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.concept{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:left;display:flex;flex-direction:column;gap:9px;transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease}
.concept:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 14px 28px -20px rgba(20,24,24,.3)}
.ctop{display:flex;align-items:center;gap:10px}
.ctop .no{font-family:var(--f-disp);font-weight:800;font-size:19px;color:var(--accent)}
.ctop .bd{font-size:11.5px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);border-radius:999px;padding:4px 12px;margin-left:auto}
.concept h4{font-size:16px;letter-spacing:-.015em}
.concept p{color:var(--ink-2);font-size:13px;line-height:1.7}
.concept .more{margin-top:auto;padding-top:12px;font-size:12.5px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:5px}

/* ---------- 4. reference thumbs ---------- */
.refs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ref{display:flex;flex-direction:column;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease}
.ref:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 14px 28px -20px rgba(20,24,24,.3)}
.ref.static{cursor:default}
.ref.static:hover{border-color:var(--line);transform:none;box-shadow:none}
.rthumb{position:relative;aspect-ratio:9/14;max-width:100%;background:var(--block);overflow:hidden}
.rthumb img{width:100%;height:100%;object-fit:cover}
.rthumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -6px rgba(0,0,0,.35)}
.rthumb .lb{position:absolute;top:11px;left:11px;font-family:var(--f-disp);font-size:10px;font-weight:800;letter-spacing:.1em;background:rgba(20,24,24,.75);color:#fff;border-radius:999px;padding:4px 10px}
.rmeta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:3px}
.rmeta .t{font-size:14px;font-weight:700}
.rmeta .s{font-family:var(--f-disp);font-size:10.5px;color:var(--muted);word-break:break-all}
.rmeta .g{font-size:12.5px;font-weight:700;color:var(--accent);display:flex;gap:5px;align-items:center;margin-top:8px}
.tipline{display:flex;gap:10px;background:var(--block);border-radius:14px;padding:13px 16px;font-size:12.5px;color:var(--ink-2);line-height:1.65;margin-top:18px}
.tipline b{font-family:var(--f-disp);font-size:10px;letter-spacing:.13em;color:var(--accent);flex:none;padding-top:3px}

/* ---------- 5. upload check ---------- */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.checklist{display:flex;flex-direction:column;gap:2px}
.chk{display:flex;gap:11px;align-items:center;padding:9px 8px;border-radius:10px;cursor:pointer}
.chk:hover{background:var(--block)}
.chk input{appearance:none;width:19px;height:19px;flex:none;border:1.5px solid var(--line);border-radius:6px;background:var(--card);display:grid;place-content:center;cursor:pointer}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-2px)}
.chk span{font-size:13.5px;line-height:1.5}
.chk input:checked + span{color:var(--muted);text-decoration:line-through}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.tg{font-size:13px;font-weight:700;border-radius:999px;padding:6px 14px;background:var(--accent-soft);color:var(--accent-deep);border:1px solid transparent}
.tg.rq{background:var(--card);color:var(--ng);border-color:var(--ng)}
.tg.mn{background:var(--cream);color:var(--cream-ink)}
.tg.tbd{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.mini{font-size:12.5px;color:var(--ink-2);line-height:1.7;margin-bottom:16px;text-align:center}
.mini em{color:var(--ng)}

/* ---------- 6. caution ---------- */
.acc-h{width:100%;display:flex;align-items:center;gap:12px;padding:4px 0;text-align:left}
.acc-h h3{font-size:19px;letter-spacing:-.02em}
.acc-h .hint{font-size:12.5px;color:var(--muted);font-weight:500}
.acc-h .arw{color:var(--accent);transition:transform .2s ease}
.pc[data-open="true"] .acc-h .arw{transform:rotate(180deg)}
.acc-b{padding-top:22px;margin-top:20px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:24px}
.cg h4{font-size:14.5px;margin-bottom:11px;display:flex;align-items:center;gap:9px}
.cg h4::before{content:"";width:3px;height:15px;background:var(--accent);border-radius:2px;flex:none}
.cg ul{display:flex;flex-direction:column;gap:8px}
.cg li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.cg li::before{content:"\2014";color:var(--accent);opacity:.5}
.cex{font-size:12.5px;color:var(--muted);background:var(--block);border-radius:12px;padding:11px 14px;margin-top:10px;line-height:1.65}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;z-index:100;background:rgba(12,16,16,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.md{background:var(--card);border-radius:24px;width:100%;max-width:740px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.md-h{display:flex;align-items:center;gap:13px;padding:24px;border-bottom:1px solid var(--line)}
.md-h .no{font-family:var(--f-disp);font-weight:800;font-size:20px;color:var(--accent)}
.md-h h3{font-size:17px;flex:1;letter-spacing:-.02em}
.md-x{width:32px;height:32px;border-radius:50%;background:var(--block);display:flex;align-items:center;justify-content:center;flex:none}
.md-b{overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:24px}
.bh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.bh .l{font-family:var(--f-disp);font-size:10.5px;font-weight:700;letter-spacing:.15em;color:var(--accent);text-transform:uppercase}
.bh .r{font-size:11.5px;color:var(--muted);margin-left:auto}
.cbox{background:var(--accent-soft);border-radius:14px;padding:16px 18px;font-size:13.5px;line-height:1.8;color:var(--ink-2)}
.cbox em{color:var(--ink)}
.hooks{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.hook{display:flex;align-items:flex-start;gap:10px;text-align:left;background:var(--block);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55;width:100%}
.hook:hover{border-color:var(--line)}
.hook .q{font-family:var(--f-disp);font-size:16px;font-weight:800;color:var(--accent);line-height:1;flex:none}
.hook .cp{margin-left:auto;color:var(--muted);flex:none;opacity:.5}
.hook.ok{border-color:var(--accent);background:var(--accent-soft)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:27px 1fr;gap:12px;align-items:start;background:var(--block);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.6}
.step .n{font-family:var(--f-disp);font-weight:800;font-size:10.5px;color:#fff;background:var(--accent);border-radius:6px;text-align:center;padding:3px 0}
.musts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.must{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:baseline;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.must .b{font-family:var(--f-disp);font-size:8.5px;font-weight:800;letter-spacing:.06em;background:var(--accent);color:#fff;border-radius:5px;padding:2px 6px;white-space:nowrap}
.must em{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:200;background:var(--ink);color:var(--card);border-radius:999px;padding:11px 22px;font-size:13px;font-weight:700}


/* ---------- compare ---------- */
.cmp{margin-top:30px;padding-top:26px;border-top:1px solid var(--line)}
.cmp-h{text-align:center;font-size:18px;font-weight:700;letter-spacing:-.02em}
.cmp-c{display:flex;justify-content:center;margin:10px 0 16px}
.cmp-g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp-i{border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--card)}
.cmp-i.main{border:2px solid var(--accent);background:var(--accent-soft)}
.cmp-i img{width:120px;height:120px;object-fit:contain;border-radius:50%;background:#fff}
.cmp-i .lb{font-size:12px;font-weight:800;color:var(--accent-deep);background:var(--card);border:1px solid var(--accent);border-radius:999px;padding:3px 12px}
.cmp-i .nm{font-size:14.5px;font-weight:700;text-align:center}
.cmp-i ul{display:flex;flex-direction:column;gap:6px;width:100%}
.cmp-i li{font-size:13px;line-height:1.55;color:var(--ink-2);display:flex;gap:8px}
.cmp-i li::before{content:"\2713";color:var(--accent);font-weight:800;flex:none}
/* ---------- scenes ---------- */
.scs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.scn{border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;background:var(--card)}
.scn.first{border:2px solid var(--accent)}
.scn-img{position:relative;aspect-ratio:9/13;background:var(--block);overflow:hidden}
.scn-img img{width:100%;height:100%;object-fit:cover}
.scn-img .num{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--f-disp);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;z-index:2}
.scn-img.icon{background:var(--accent-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--accent)}
.scn-img.icon b{font-family:var(--f-disp);font-size:12px;letter-spacing:.1em;text-align:center;line-height:1.6}
.scn-b{padding:14px 12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.scn-t{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.tel{display:flex;align-items:center;gap:6px;text-align:left;background:var(--mark);border-radius:10px;padding:9px 10px;font-size:12.5px;font-weight:700;line-height:1.45;width:100%;color:var(--ink)}
.tel span{flex:1}
.tel svg{flex:none;opacity:.55}
.tel.ok{outline:2px solid var(--accent)}
.scn-n{margin-top:auto;padding-top:8px;font-size:11.5px;color:var(--muted);line-height:1.6}
.ngline{margin-top:18px;text-align:center;font-size:13px;font-weight:700;color:var(--ng);line-height:1.7}
@media (max-width:1000px){.scs{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.scs{grid-template-columns:repeat(2,minmax(0,1fr))}.cmp-g{grid-template-columns:1fr}}


.pimgs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pimgs .shot{aspect-ratio:4/5;background:#fff}
.pimgs .shot img{width:100%;height:100%;object-fit:contain}
.plink{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:14px}
.plink-l{font-size:12px;font-weight:700;color:var(--ink-2)}
.plink .urlbox{padding:6px 12px;flex:1;min-width:140px;text-align:left}
.plink .btn{padding:7px 14px;font-size:12px}
.plink-n{font-size:11.5px;color:var(--muted);margin-top:6px}

footer{background:var(--dark);color:#8B9393;margin-top:12px}
.foot-in{max-width:var(--maxw);margin:0 auto;padding:26px 24px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:11.5px}
footer .c{font-family:var(--f-disp);letter-spacing:.13em;font-weight:700}

@media (max-width:900px){
  .pc{padding:34px 26px}
  .prow,.prow.solo,.duo{grid-template-columns:1fr}
  .acc-b{grid-template-columns:1fr}
  .refs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .wrap{padding:0 14px 60px;gap:16px}
  .pc{padding:28px 18px;border-radius:22px}
  .pc.tight{padding:22px 18px}
  .topbar-in{padding:10px 16px;gap:10px}
  .tb-nav{order:3;width:100%;flex:auto;justify-content:flex-start}
  .sect .hd{font-size:21px}
  .tiles,.concepts,.hooks,.musts,.campaign-gallery{grid-template-columns:1fr}
  .refs{grid-template-columns:minmax(0,1fr)}
  .acc-h h3{font-size:17px}
  .foot-in{padding:22px 16px}
}

   다른 브랜드 캠페인으로 바꿀 때는 아래 G 객체만 수정하세요.
   레이아웃 / 기능 코드는 건드릴 필요가 없습니다.

   G.theme   : 포인트 컬러 (버튼·아이콘·뱃지 전부 accent 기준)
   G.brand   : 상단바 · 제품 카드에 들어가는 브랜드명
   G.shopUrl : 딥링크 (버튼 · QR · 복사 전부 이 값 하나를 씁니다)
   G.hero    : 제품 카드 (이미지 1장 / 뱃지 / 한 줄 정의 / 설명)
   G.points  : 상품 포인트 4개 타일
   G.musts   : 필수 반영 요소 — 컨셉 모달 안에 공통으로 들어갑니다
   G.concepts: 콘텐츠 컨셉 카드 + 모달 내용
   G.refs    : 레퍼런스 영상 (클릭 시 바로 이동)
   G.upload  : 업로드 전 체크 · 해시태그
   G.cautions: 주의사항
   ========================================================================= */

var G = JSON.parse(document.getElementById("guide-data").textContent);
/* ==================== 이 아래는 수정 불필요 ==================== */

var lang = "ja";
try { var s = localStorage.getItem("commac-guide-lang"); if (s === "ja" || s === "ko") lang = s; } catch (e) {}

var IDS = ["product","guide","reference","check","caution"];

function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function node(html){ var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; }
/* *별표* 로 감싼 부분에 형광펜이 들어갑니다 */
function mk(t){ return esc(t).replace(/\*([^*]+)\*/g, '<mark>$1</mark>'); }
function bd(t){
  return esc(t)
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    /* 예전 형식(<em>, <b>)이 남아 있어도 강조로 처리 */
    .replace(/&lt;(em|b|strong)&gt;/g, '<em>')
    .replace(/&lt;\/(em|b|strong)&gt;/g, '</em>');
}

function iArrow(){ return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>'; }
function iCopy(){ return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'; }
function iExt(){ return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>'; }
function iPlay(){ return '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>'; }
function iShop(){ return '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 12v8h14v-8"/><path d="M10 20v-5h4v5"/></svg>'; }
function iGlow(){ return '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>'; }
function iChev(){ return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'; }

function sect(key){
  var s = G.sections[key];
  return '<div class="sect"><div class="eb">' + esc(s.eb) + '</div>' +
    '<h2 class="hd">' + mk(s.t[lang]) + '</h2>' +
    (s.s ? '<p class="sb">' + esc(s.s[lang]) + '</p>' : "") + '</div>';
}
function scHead(label, title){
  return '<div class="sc-h"><div class="l">' + esc(label) + '</div><div class="sc-t">' + esc(title) + '</div></div>';
}

function render(){
  var r = document.documentElement;
  r.lang = lang === "ja" ? "ja" : "ko";
  r.style.setProperty("--accent", G.theme.accent);
  r.style.setProperty("--accent-deep", G.theme.accentDeep);
  r.style.setProperty("--accent-soft", G.theme.accentSoft);

  var plist = (G.products || []).filter(function(pr){
    return pr.image || (pr.name && pr.name[lang]) || (pr.url && pr.url.trim());
  });
  var pTitle = plist.length
    ? (plist[0].name ? (plist[0].name[lang] || "") : "") + (plist.length > 1 ? " 외 " + (plist.length - 1) + "개" : "")
    : "";
  document.getElementById("tb-brand").innerHTML =
    esc(G.brand.label) + (pTitle ? ' <i>·</i> ' + esc(pTitle) : "");
  document.getElementById("btn-ko").setAttribute("aria-pressed", String(lang === "ko"));
  document.getElementById("btn-ja").setAttribute("aria-pressed", String(lang === "ja"));
  var refItems = (G.refs.items || []).filter(function(rf){
    return (rf.url && rf.url.trim()) || (rf.thumb && rf.thumb.trim());
  });
  var showRefs = refItems.length > 0;

  document.getElementById("nav").innerHTML = G.nav[lang].map(function(n, i){
    if (IDS[i] === "reference" && !showRefs) return "";
    return '<a href="#' + IDS[i] + '">' + esc(n) + '</a>';
  }).join("");
  document.getElementById("foot").textContent = G.ui.foot[lang];

  var h = "";
  var U = G.upload;

  /* ---------- 1. 제품 소개 ---------- */
  function shotOf(pr){
    return pr.image ? '<div class="shot"><img src="' + pr.image + '" alt=""></div>' : "";
  }
  function linkBtns(pr, full){
    if (!(pr.url && pr.url.trim())) return "";
    return '<a class="btn btn-p' + (full ? " btn-full" : "") + '" href="' + pr.url +
             '" target="_blank" rel="noopener">' + esc(U.openShop[lang]) + iExt() + '</a>' +
           '<button class="btn btn-g' + (full ? " btn-full" : "") + '" data-cpurl="' + esc(pr.url) + '">' +
             iCopy() + esc(U.copyLink[lang]) + '</button>';
  }
  function introHtml(){
    var lines = (G.intro && G.intro[lang]) || [];
    return lines.length
      ? '<div class="intro">' + lines.map(function(b){ return '<p>' + esc(b) + '</p>'; }).join("") + '</div>'
      : "";
  }

  h += '<section id="product"><div class="pc">' + sect("product");

  if (plist.length === 1) {
    /* 제품 1개 — 큰 이미지 + 정보 + 링크 카드 */
    var p0 = plist[0];
    var hasUrl0 = !!(p0.url && p0.url.trim());
    var info = '<div class="pinfo">' +
      (p0.badge && p0.badge[lang] ? '<span class="pill">' + esc(p0.badge[lang]) + '</span>' : "") +
      '<h3>' + esc(G.brand.label) + ' ' + esc(p0.name ? (p0.name[lang] || "") : "") + '</h3>' +
      (p0.pen && p0.pen[lang] ? '<p class="pen">' + mk(p0.pen[lang]) + '</p>' : "") +
      '</div>';
    h += '<div class="pimgs">' + shotOf(p0) + (p0.image2 ? '<div class="shot"><img src="' + p0.image2 + '" alt=""></div>' : "") + '</div>';
    h += info;
    if (hasUrl0) {
      h += '<div class="plink"><span class="plink-l">' + esc(U.linkLabelKo[lang]) + '</span>' +
        '<a class="urlbox" href="' + p0.url + '" target="_blank" rel="noopener">' + esc(p0.url) + '</a>' +
        '<button class="btn btn-g" data-cpurl="' + esc(p0.url) + '">' + iCopy() + esc(U.copyLink[lang]) + '</button></div>' +
        '<p class="plink-n">' + esc(U.linkNote[lang]) + '</p>';
    }
    if (!hasUrl0 && p0.linkPending) {
      h += '<div class="plink"><span class="plink-l">' + esc(U.linkLabelKo[lang]) + '</span><span class="url-pending urlbox">' + esc(p0.linkPending[lang]) + '</span></div>';
    }
    h += introHtml();
  } else if (plist.length > 1) {
    /* 제품 여러 개 — 카드 그리드, 카드마다 링크 */
    h += introHtml();
    h += '<div class="pgrid">' + plist.map(function(pr){
      return '<div class="pcard">' + shotOf(pr) + '<div class="pcbody">' +
        (pr.badge && pr.badge[lang] ? '<span class="pill">' + esc(pr.badge[lang]) + '</span>' : "") +
        '<h4>' + esc(pr.name ? (pr.name[lang] || "") : "") + '</h4>' +
        (pr.pen && pr.pen[lang] ? '<p class="pcpen">' + mk(pr.pen[lang]) + '</p>' : "") +
        '<div class="pcbtns">' + linkBtns(pr, true) + '</div>' +
        '</div></div>';
    }).join("") + '</div>';

    var allUrls = plist.filter(function(pr){ return pr.url && pr.url.trim(); })
                       .map(function(pr){ return pr.url.trim(); });
    if (allUrls.length > 1) {
      h += '<div class="allcopy">' +
        '<button class="btn btn-g" data-cpurl="' + esc(allUrls.join("\n")) + '">' +
        iCopy() + esc(U.copyAllLinks[lang]) + '</button>' +
        '<p class="mini" style="margin:10px 0 0">' + esc(U.linkNote[lang]) + '</p></div>';
    }
  }
  /* 기존·신작 비교 */
  var CP = G.compare;
  if (CP && CP.items && CP.items.length) {
    h += '<div class="cmp"><h3 class="cmp-h">' + mk(CP.title[lang]) + '</h3>' +
      (CP.common[lang] ? '<div class="cmp-c"><span class="pill">' + esc(CP.common[lang]) + '</span></div>' : "") +
      '<div class="cmp-g">' + CP.items.map(function(it){
        return '<div class="cmp-i' + (it.main ? " main" : "") + '">' +
          (it.image ? '<img src="' + it.image + '" alt="">' : (it.icon ? '<span class="ico"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/><path d="M10 12l2 2-1.5 2 2 2"/></svg></span>' : "")) +
          '<span class="lb">' + esc(it.label[lang]) + '</span>' +
          '<div class="nm">' + esc(it.name[lang]) + '</div>' +
          '<ul>' + (it.pts[lang] || []).map(function(x){ return '<li><span>' + esc(x) + '</span></li>'; }).join("") + '</ul></div>';
      }).join("") + '</div>' +
      (CP.note[lang] ? '<p class="fn">' + esc(CP.note[lang]) + '</p>' : "") + '</div>';
  }
  h += '</div></section>';

  /* ---------- 2. 필수 씬 & 자막 ---------- */
  var SC = G.scenes;
  h += '<section id="guide"><div class="pc">' + sect("scenes");
  var _th = (SC.themes && SC.themes.length) ? SC.themes : [{items: SC.items}];
  _th.forEach(function(TH){
  if (TH.title) h += '<div class="thm"><span class="thm-l">' + esc(TH.label[lang]) + '</span><h3 class="thm-t">' + esc(TH.title[lang]) + '</h3>' + (TH.desc ? '<p class="thm-d">' + esc(TH.desc[lang]) + '</p>' : '') + '</div>';
  h += '<div class="scs">' + TH.items.map(function(s, i){
    var imgs = (s.images && s.images.length) ? s.images : (s.image ? [s.image] : []);
    var img = imgs.length
      ? '<div class="scn-img' + (imgs.length > 1 ? ' multi' : '') + '"><span class="num">' + (i + 1) + '</span>' +
        imgs.map(function(src, k){ return '<img class="' + (k === 0 ? 'on' : '') + '" src="' + src + '" alt="">'; }).join("") +
        (imgs.length > 1 ? '<span class="cnt">1/' + imgs.length + '</span><div class="dots">' +
          imgs.map(function(_, k){ return '<button class="dot' + (k === 0 ? ' on' : '') + '" data-go="' + k + '" aria-label="' + (k + 1) + '"></button>'; }).join("") + '</div>' : "") +
        '</div>'
      : '<div class="scn-img icon"><span class="num">' + (i + 1) + '</span>' + (s.icon === "glow" ? iGlow() : iShop()) + '<b>' + esc(s.iconLabel || "Qoo10") + '</b></div>';
    return '<div class="scn' + (i === 0 ? " first" : "") + '">' + img + '<div class="scn-b">' +
      '<div class="scn-t">' + esc(s.title[lang]) + '</div>' +
      (s.telops[lang] || []).filter(function(t){ return t; }).map(function(t){
        return '<button class="tel" data-tel="' + esc(t) + '"><span>' + esc(t) + '</span>' + iCopy() + '</button>';
      }).join("") +
      (s.note[lang] ? '<p class="scn-n">' + esc(s.note[lang]) + '</p>' : "") + '</div></div>';
  }).join("") + '</div>';
  });
  if (SC.photoNote && SC.photoNote[lang]) h += '<p class="fn scn-photo">' + esc(SC.photoNote[lang]) + '</p>';
  if (SC.ng && SC.ng[lang]) h += '<p class="ngline">' + esc(SC.ng[lang]) + '</p>';
  h += '</div></section>';

  if (G.fold) { var FD = G.fold;
    h += '<section id="fold"><div class="pc"><div class="sect"><div class="eb">' + esc(FD.eb) + '</div><h2 class="hd">' + mk(FD.t[lang]) + '</h2>' + (FD.s ? '<p class="sb">' + esc(FD.s[lang]) + '</p>' : '') + '</div>';
    h += '<div class="fold">' + FD.steps.map(function(st, i){ return '<figure><div class="fimg"><span class="num">' + (i + 1) + '</span><img src="' + st.img + '" alt=""></div><figcaption>' + esc(st.cap[lang]) + '</figcaption></figure>'; }).join('') + '</div></div></section>'; }
  /* ---------- 4. 참고 레퍼런스 ---------- */
  if (showRefs) {
    h += '<section id="reference"><div class="pc">' + sect("refs");
    h += '<div class="refs">' + refItems.map(function(rf, i){
      var hasUrl = !!(rf.url && rf.url.trim());
      var name = rf.t ? (rf.t[lang] || "") : "";
      var code = hasUrl ? rf.url.replace(/^https?:\/\/(www\.)?instagram\.com\//, "").replace(/\/$/, "") : "";
      var thumb = '<div class="rthumb"><span class="lb">REF ' + (i + 1) + '</span>' +
        (rf.thumb ? '<img src="' + rf.thumb + '" alt="">' : "") +
        '</div>';
      var meta = "";
      if (name) {
        meta = '<div class="rmeta">' +
          (name ? '<span class="t">' + esc(name) + '</span>' : "") +

          '</div>';
      }
      var fr = (rf.frames || []).length ? '<div class="rframes">' + rf.frames.map(function(f){ return '<img src="' + f.img + '" alt=""><span>' + esc(f.cap[lang] || '') + '</span>'; }).map(function(x){ return '<figure>' + x + '</figure>'; }).join('') + '</div>' : '';
      var sc = rf.script ? '<div class="rscr"><p class="rscr-l">' + esc(G.refs.scriptLabel[lang]) + '</p>' + (lang === 'ja' ? '<p class="rscr-h">日本語訳</p><p>' + esc(rf.script.ja).replace(/\n/g, '<br>') + '</p><p class="rscr-h">原文（韓国語）</p>' : '') + '<p class="rscr-ko">' + esc(rf.script.ko).replace(/\n/g, '<br>') + '</p></div>' : '';
      var card = hasUrl
        ? '<a class="ref" href="' + esc(rf.url) + '" target="_blank" rel="noopener">' + thumb + meta + '<div class="rmeta" style="padding-top:0"><span class="g">' + esc(G.refs.go[lang]) + iExt() + '</span></div></a>'
        : '<div class="ref static">' + thumb + meta + '</div>';
      return '<div class="refrow">' + card + '<div class="rbody">' + fr + sc + '</div></div>';
    }).join("") + '</div>';
    if (G.ui.refTip[lang]) {
      h += '<div class="tipline"><b>TIP</b><span>' + esc(G.ui.refTip[lang]) + '</span></div>';
    }
    h += '</div></section>';
  }

  /* ---------- 5. 업로드 전 체크 ---------- */
  h += '<section id="check"><div class="pc">' + sect("check");
  h += '<div class="duo">';
  h += '<div class="sc">' + scHead("FINAL CHECK", U.checkLabelKo[lang]) + '<div class="checklist">' +
    U.checks[lang].map(function(c, i){
      return '<label class="chk"><input type="checkbox" id="ck-' + i + '"><span>' + esc(c) + '</span></label>';
    }).join("") + '</div></div>';
  var TK = {ko:["필수","추천","공식 계정 태그"], ja:["必須","おすすめ","公式アカウントをタグ付け"]}[lang];
  h += '<div class="sc">' + scHead("HASHTAG & TAG", U.tagLabelKo[lang]) +
    '<div class="tagrow"><span class="tagk">' + TK[0] + '</span><div class="tags">' +
    U.tagsRequired.map(function(t){ return '<span class="tg rq">' + esc(t) + '</span>'; }).join("") + '</div></div>' +
    (U.tagsBrand.length ? '<div class="tagrow rec"><span class="tagk">' + TK[1] + '</span><div class="tags">' +
    U.tagsBrand.map(function(t){ return '<span class="tg">' + esc(t) + '</span>'; }).join("") + '</div></div>' : "") +
    (U.mentions.length ? '<div class="tagrow"><span class="tagk">' + TK[2] + '</span><div class="tags">' +
    U.mentions.map(function(t){ return '<span class="tg mn">' + esc(t) + '</span>'; }).join("") +
    (U.tagsTbd[lang] ? '<span class="tg tbd">' + esc(U.tagsTbd[lang]) + '</span>' : "") + '</div></div>' : "");
  h += '<p class="mini">' + bd(U.tagNote[lang]) + '</p>';
  h += '<button class="btn btn-p btn-c" id="cp-tags">' + iCopy() + esc(U.copyTags[lang]) + '</button></div>';
  h += '</div></div></section>';

  /* ---------- 6. 주의사항 ---------- */
  var C = G.cautions;
  h += '<section id="caution"><div class="pc tight" data-open="true" id="acc">' +
    '<div class="acc-h"><h3>' + esc(C.label[lang]) + '</h3></div>';
  h += '<div class="acc-b" id="acc-b">' + C.groups[lang].map(function(g){
    return '<div class="cg"><h4>' + esc(g.h) + '</h4><ul>' +
      g.items.map(function(x){ return '<li><span>' + esc(x) + '</span></li>'; }).join("") + '</ul>' +
      (g.ex ? '<div class="cex">' + esc(g.ex) + '</div>' : "") + '</div>';
  }).join("") + '</div></div></section>';

  document.getElementById("app").innerHTML = h;
  wire();
}

function toast(m){
  var o = document.querySelector(".toast"); if (o) o.remove();
  var t = node('<div class="toast">' + esc(m) + '</div>');
  document.body.appendChild(t);
  setTimeout(function(){ if (t.parentNode) t.remove(); }, 1500);
}
function copyText(text, done){
  function ok(){ toast(G.ui.copied[lang]); if (done) done(); }
  function fb(){
    try {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); ok();
    } catch (e) { toast(text); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fb);
  else fb();
}

var __scnTimers = [];
function wire(){
  __scnTimers.forEach(clearInterval); __scnTimers = [];
  Array.prototype.forEach.call(document.querySelectorAll(".scn-img.multi"), function(box){
    var ims = box.querySelectorAll("img"), dots = box.querySelectorAll(".dot"), cnt = box.querySelector(".cnt"), cur = 0;
    function show(k){ cur = (k + ims.length) % ims.length;
      Array.prototype.forEach.call(ims, function(e, j){ e.classList.toggle("on", j === cur); });
      Array.prototype.forEach.call(dots, function(e, j){ e.classList.toggle("on", j === cur); });
      if (cnt) cnt.textContent = (cur + 1) + "/" + ims.length; }
    Array.prototype.forEach.call(dots, function(d){ d.addEventListener("click", function(e){ e.stopPropagation(); show(+d.getAttribute("data-go")); }); });
    box.addEventListener("click", function(){ show(cur + 1); });
    __scnTimers.push(setInterval(function(){ if (!document.body.classList.contains("editing")) show(cur + 1); }, 3500));
  });
  var key = "cg-check", st = {};
  try { st = JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch (e) { st = {}; }
  Array.prototype.forEach.call(document.querySelectorAll(".chk input"), function(i){
    if (st[i.id]) i.checked = true;
    i.addEventListener("change", function(){
      st[i.id] = i.checked;
      try { localStorage.setItem(key, JSON.stringify(st)); } catch (e) {}
    });
  });

  var acc = document.getElementById("acc"), ah = document.getElementById("acc-h"),
      ab = document.getElementById("acc-b");
  if (ah) ah.addEventListener("click", function(){
    var open = acc.getAttribute("data-open") === "true";
    acc.setAttribute("data-open", String(!open));
    ab.hidden = open;
    ah.setAttribute("aria-expanded", String(!open));

  });

  var ct = document.getElementById("cp-tags");
  if (ct) ct.addEventListener("click", function(){
    copyText(G.upload.tagsRequired.concat(G.upload.tagsBrand).concat(G.upload.mentions).join(" "));
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-cpurl]"), function(b){
    b.addEventListener("click", function(){ copyText(b.getAttribute("data-cpurl")); });
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-tel]"), function(b){
    b.addEventListener("click", function(){
      copyText(b.getAttribute("data-tel"), function(){ b.classList.add("ok"); setTimeout(function(){ b.classList.remove("ok"); }, 1200); });
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-c]"), function(b){
    b.addEventListener("click", function(){ openModal(parseInt(b.getAttribute("data-c"), 10)); });
  });

}

function openModal(i){
  var c = G.concepts[i]; if (!c) return;
  var U = G.ui;
  var h = '<div class="ov" id="ov"><div class="md" role="dialog" aria-modal="true">';
  h += '<div class="md-h"><span class="no">0' + (i + 1) + '</span><h3>' + esc(c.title[lang]) + '</h3>' +
       '<button class="md-x" id="mx" aria-label="close"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="md-b">';
  h += '<div><div class="bh"><span class="l">' + esc(U.lblConcept[lang]) + '</span></div><div class="cbox">' + bd(c.concept[lang]) + '</div></div>';
  h += '<div><div class="bh"><span class="l">' + esc(U.lblHooks[lang]) + '</span><span class="r">' + esc(U.hookHint[lang]) + '</span></div><div class="hooks">' +
    c.hooks[lang].map(function(x, k){
      return '<button class="hook" data-h="' + k + '"><span class="q">“</span><span>' + esc(x) + '</span><span class="cp">' + iCopy() + '</span></button>';
    }).join("") + '</div></div>';
  h += '<div><div class="bh"><span class="l">' + esc(U.lblFlow[lang]) + '</span></div><div class="steps">' +
    c.points[lang].map(function(x, k){
      return '<div class="step"><span class="n">0' + (k + 1) + '</span><span>' + esc(x) + '</span></div>';
    }).join("") + '</div></div>';
  h += '<div><div class="bh"><span class="l">' + esc(G.musts.label[lang]) + '</span></div><div class="musts">' +
    G.musts.items[lang].map(function(x){
      return '<div class="must"><span class="b">MUST</span><span>' + bd(x) + '</span></div>';
    }).join("") + '</div></div>';
  h += '</div></div></div>';

  var ov = node(h);
  document.body.appendChild(ov);
  document.body.style.overflow = "hidden";
  function close(){ ov.remove(); document.body.style.overflow = ""; document.removeEventListener("keydown", onKey); }
  function onKey(e){ if (e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  ov.addEventListener("click", function(e){ if (e.target === ov) close(); });
  ov.querySelector("#mx").addEventListener("click", close);
  Array.prototype.forEach.call(ov.querySelectorAll("[data-h]"), function(b){
    b.addEventListener("click", function(){
      var k = parseInt(b.getAttribute("data-h"), 10);
      copyText(c.hooks[lang][k], function(){
        b.classList.add("ok");
        setTimeout(function(){ b.classList.remove("ok"); }, 1300);
      });
    });
  });
  ov.querySelector("#mx").focus();
}

function setLang(l){
  lang = l;
  try { localStorage.setItem("commac-guide-lang", l); } catch (e) {}
  var o = document.getElementById("ov");
  if (o) { o.remove(); document.body.style.overflow = ""; }
  render();
}
document.getElementById("btn-ko").addEventListener("click", function(){ setLang("ko"); });
document.getElementById("btn-ja").addEventListener("click", function(){ setLang("ja"); });
render();

</script></body></html>
